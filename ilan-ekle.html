<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlan Ekle</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>

    <div class="menu">
        <a href="index.html" class="logo">YTÜ Ekosistem</a>
        <div>
            <a href="index.html">İlanlar</a>
            <a href="ilanlarim.html">İlanlarım</a>
            <a href="ilan-ekle.html">İlan Ekle</a>
            <a href="#" onclick="cikisYap()">Çıkış</a>
        </div>
    </div>

    <div class="icerik">
        <div class="kutu kutu-kucuk" style="max-width:500px;">
            <h2>Yeni İlan Ekle</h2>
            <p style="color:gray;">Ders seçerek elindeki laboratuvar malzemelerini paylaş.</p>
            <div id="mesaj" class="mesaj"></div>

            <form onsubmit="ilanEkle(event)">
                <div class="form-alan">
                    <label>Ders Seçimi:</label>
                    <select id="dersKodu" required onchange="malzemeleriGoster()">
                        <option value="">Ders seçiniz</option>
                        <option value="BLM2611">BLM2611</option>
                        <option value="BLM1033">BLM1033</option>
                        <option value="Breadboard">Breadboard</option>
                        <option value="Multimetre">Multimetre</option>
                    </select>
                </div>

                <div id="malzeme-alani" style="display:none;">
                    <label style="font-weight:bold; color:#555; margin-bottom:5px; display:block;">Malzemeler:</label>
                    <div id="malzeme-listesi" class="malzeme-listesi"></div>
                </div>

                <br>
                <button type="submit" class="buton" id="ekleButon">İlanı Yayınla</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        var veritabani = supabase.createClient(
            'https://avtoydkihbspbclgtmfd.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2dG95ZGtpaGJzcGJjbGd0bWZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMTMzMzcsImV4cCI6MjA5MjY4OTMzN30.PJdYOGKV9nR6l0SGW_u1ZMUa0ikn_LTpBykxwhvVcy8'
        );

        // ders malzemeleri listesi
        var dersMalzemeleri = {
            "BLM2611": [
                "7400 (NAND)", "7402 (NOR)", "7404 (Inverter)",
                "7410 (3-input NAND)", "7420 (4-input NAND)",
                "7427 (3-input NOR)", "7432 (OR)", "7408 (AND)",
                "7474 (D Flip-Flop)", "7486 (XOR)",
                "74112 (JK Flip-Flop)", "74153 (Multiplexer)",
                "Jumper Kablo"
            ],
            "BLM1033": [
                "Direnç Seti", "Kondansatör Seti", "Diyot",
                "Breadboard", "Jumper Kablo Seti", "Multimetre"
            ],
            "Breadboard": [
                "Tam Boy Breadboard"
            ],
            "Multimetre": [
                "Dijital Multimetre", "Multimetre Probu"
            ]
        };

        var kullanici = null;

        // giris kontrolu
        window.onload = async function() {
            var oturum = await veritabani.auth.getSession();
            if (!oturum.data.session) {
                alert('Bu sayfayı görmek için giriş yapmalısınız.');
                window.location.href = 'giris.html';
                return;
            }
            kullanici = oturum.data.session.user;
        }

        // ders secildiginde malzemeleri goster
        function malzemeleriGoster() {
            var dersKodu = document.getElementById('dersKodu').value;
            var alan = document.getElementById('malzeme-alani');
            var liste = document.getElementById('malzeme-listesi');

            if (dersKodu == '') {
                alan.style.display = 'none';
                return;
            }

            var malzemeler = dersMalzemeleri[dersKodu];
            if (!malzemeler) {
                alan.style.display = 'none';
                return;
            }

            var html = '';
            for (var i = 0; i < malzemeler.length; i++) {
                html += '<label>' +
                    '<input type="checkbox" value="' + malzemeler[i] + '"> ' +
                    malzemeler[i] +
                    '</label>';
            }

            liste.innerHTML = html;
            alan.style.display = 'block';
        }

        async function ilanEkle(e) {
            e.preventDefault();

            var dersKodu = document.getElementById('dersKodu').value;
            var buton = document.getElementById('ekleButon');

            // secilen malzemeleri topla
            var checkboxlar = document.querySelectorAll('#malzeme-listesi input[type="checkbox"]');
            var secilenMalzemeler = [];
            for (var i = 0; i < checkboxlar.length; i++) {
                if (checkboxlar[i].checked) {
                    secilenMalzemeler.push(checkboxlar[i].value);
                }
            }

            if (secilenMalzemeler.length == 0) {
                mesajGoster('En az bir malzeme seçmelisiniz.', true);
                return;
            }

            buton.disabled = true;
            buton.textContent = 'Yayınlanıyor...';

            var sonuc = await veritabani.from('listings').insert([{
                ders_kodu: dersKodu,
                malzemeler: secilenMalzemeler,
                olusturan_id: kullanici.id
            }]);

            if (sonuc.error) {
                mesajGoster('Hata: ' + sonuc.error.message, true);
                buton.disabled = false;
                buton.textContent = 'İlanı Yayınla';
            } else {
                mesajGoster('İlan eklendi!', false);
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1000);
            }
        }

        async function cikisYap() {
            await veritabani.auth.signOut();
            window.location.href = 'index.html';
        }

        function mesajGoster(metin, hataMi) {
            var el = document.getElementById('mesaj');
            el.textContent = metin;
            el.style.display = 'block';
            if (hataMi) {
                el.className = 'mesaj mesaj-hata';
            } else {
                el.className = 'mesaj mesaj-basari';
            }
        }
    </script>
</body>
</html>
