<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>

    <div class="menu">
        <a href="index.html" class="logo">YTÜ Ekosistem</a>
        <div>
            <a href="index.html">İlanlar</a>
            <a href="ilanlarim.html">İlanlarım</a>
            <a href="ilan-ekle.html">İlan Ekle</a>
            <a href="#" onclick="cikisYap()">Çıkış</a>
        </div>
    </div>

    <div class="icerik">
        <div class="kutu">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Profilim</h2>
                <button class="buton buton-sil" onclick="cikisYap()">Çıkış Yap</button>
            </div>
            <p id="yukleniyor">Yükleniyor...</p>
            <div id="profil-bilgi" style="display:none;">
                <p><strong>Email:</strong> <span id="email"></span></p>
            </div>
        </div>

        <div class="kutu">
            <h2>Benim İlanlarım</h2>
            <div id="ilan-alani" class="ilan-listesi">
                <p>Yükleniyor...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        var veritabani = supabase.createClient(
            'https://avtoydkihbspbclgtmfd.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2dG95ZGtpaGJzcGJjbGd0bWZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMTMzMzcsImV4cCI6MjA5MjY4OTMzN30.PJdYOGKV9nR6l0SGW_u1ZMUa0ikn_LTpBykxwhvVcy8'
        );

        var kullanici = null;

        window.onload = async function() {
            var oturum = await veritabani.auth.getSession();
            if (!oturum.data.session) {
                alert('Giriş yapmalısınız.');
                window.location.href = 'giris.html';
                return;
            }

            kullanici = oturum.data.session.user;
            document.getElementById('email').textContent = kullanici.email;
            document.getElementById('yukleniyor').style.display = 'none';
            document.getElementById('profil-bilgi').style.display = 'block';

            ilanlariGetir();
        }

        async function ilanlariGetir() {
            var sonuc = await veritabani.from('listings')
                .select('*')
                .eq('olusturan_id', kullanici.id);

            if (sonuc.error) {
                document.getElementById('ilan-alani').innerHTML = '<p>Hata oluştu.</p>';
                return;
            }

            var ilanlar = sonuc.data;
            var alan = document.getElementById('ilan-alani');

            if (ilanlar.length == 0) {
                alan.innerHTML = '<p>Henüz yayınladığınız bir ilan bulunmuyor.</p>';
                return;
            }

            var html = '';
            for (var i = 0; i < ilanlar.length; i++) {
                var ilan = ilanlar[i];

                var malzemeHtml = '';
                if (ilan.malzemeler) {
                    var malzemeler = ilan.malzemeler;
                    if (typeof malzemeler === 'string') {
                        malzemeler = malzemeler.split(',');
                    }
                    malzemeHtml = '<ul>';
                    for (var j = 0; j < malzemeler.length; j++) {
                        malzemeHtml += '<li>' + malzemeler[j] + '</li>';
                    }
                    malzemeHtml += '</ul>';
                }

                html += '<div class="ilan-karti">' +
                    '<h3>' + ilan.ders_kodu + '</h3>' +
                    '<p><strong>Malzemeler:</strong></p>' +
                    malzemeHtml +
                    '<br>' +
                    '<button class="buton buton-sil" onclick="ilanSil(\'' + ilan.id + '\')">Sil</button>' +
                    '</div>';
            }

            alan.innerHTML = html;
        }

        async function ilanSil(id) {
            var emin = confirm('Bu ilanı silmek istediğinize emin misiniz?');
            if (!emin) return;

            var sonuc = await veritabani.from('listings').delete().eq('id', id);
            if (sonuc.error) {
                alert('Silme hatası.');
            } else {
                ilanlariGetir();
            }
        }

        async function cikisYap() {
            await veritabani.auth.signOut();
            window.location.href = 'giris.html';
        }
    </script>
</body>
</html>
