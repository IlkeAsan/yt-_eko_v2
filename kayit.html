<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>

    <div class="menu">
        <a href="index.html" class="logo">YTÜ Ekosistem</a>
        <div>
            <a href="giris.html">Giriş Yap</a>
        </div>
    </div>

    <div class="icerik">
        <div class="kutu kutu-kucuk">
            <h2>Kayıt Ol</h2>
            <div id="mesaj" class="mesaj"></div>

            <form onsubmit="kayitOl(event)">
                <div class="form-alan">
                    <label>İsim:</label>
                    <input type="text" id="isim" required>
                </div>
                <div class="form-alan">
                    <label>Soyisim:</label>
                    <input type="text" id="soyisim" required>
                </div>
                <div class="form-alan">
                    <label>Email:</label>
                    <input type="email" id="email" required placeholder="ornek@std.yildiz.edu.tr">
                    <small style="color:gray;">Sadece @std.yildiz.edu.tr veya @yildiz.edu.tr kabul edilir.</small>
                </div>
                <div class="form-alan">
                    <label>Telefon (11 haneli):</label>
                    <input type="tel" id="telefon" required placeholder="05xxxxxxxxx">
                </div>
                <div class="form-alan">
                    <label>Şifre:</label>
                    <input type="password" id="sifre" required minlength="6">
                </div>
                <div class="form-alan">
                    <label>Şifre Tekrar:</label>
                    <input type="password" id="sifreTekrar" required minlength="6">
                </div>
                <button type="submit" class="buton" id="kayitButon">Kayıt Ol</button>
            </form>

            <p style="margin-top:15px; text-align:center;">
                Hesabınız var mı? <a href="giris.html">Giriş Yapın</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/kayit.js"></script>
</body>
</html>
